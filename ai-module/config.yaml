# ============================================================
# config.yaml — SaMD Diabetes Risk v2.0 (2026)
# ============================================================

random_seed: 42

data:
  path: data/nhanes_clinical_cohort.csv
  external_val_path: data/external/cohort_validation.csv
  prs_path: data/genomics/prs_scores.csv
  test_size: 0.20

tuning:
  n_trials: 100           # Optuna Bayesian trials
  timeout: 3600           # Max 1h optimization

model:
  save_dir: models/
  tft_hidden_size: 64     # Temporal Fusion Transformer
  tft_heads: 4
  tft_dropout: 0.1

mlflow:
  tracking_uri: mlruns/
  registry_uri: mlruns/

conformal:
  alpha: 0.05             # 95% coverage guarantee

regulatory:
  standard: "FDA 21 CFR Part 11"
  classification: "SaMD Class II"
  audit_trail: true